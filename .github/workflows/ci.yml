name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  upstream-seam:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the verifier diffs against the fork base commit
      # recorded in docs/UPSTREAM.md, which a shallow clone does not contain.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Both scripts are dependency-free, so this job skips `npm ci`. That also
      # means `npm run prepare` has not registered the merge driver, which the
      # verifier insists on — so register it here.
      - run: node --experimental-strip-types scripts/setup-intake.ts

      - run: npm run verify-upstream-seam

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Disable AppArmor
        shell: bash
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - run: npm test
        env:
          # `npm test` collects `build/tests/stress/**` too. The kill interlock
          # (`tests/stress/helpers.ts`) is what keeps those scenarios inert, and
          # it is deliberately pinned off here so no runner-level variable can
          # arm a suite that kills processes: the stress run is dispatch-only
          # (see stress-test.yml).
          STRESS_ALLOW_PROCESS_KILLS: 'false'
